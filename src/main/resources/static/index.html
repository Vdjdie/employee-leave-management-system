
<!DOCTYPE>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Leave Management System - Login</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="login-container">

        <h1>
            Employee Leave Management System
        </h1>

        <h2>Login</h2>

        <form id="loginForm">

            <label>
                Username:
            </label>

            <input type="text"
                   id="username"
                   required>

            <label>
                Password:
            </label>

            <input type="password"
                   id="password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
